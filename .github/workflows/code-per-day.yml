name: Code Per Day

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cnordenb/code-per-day@main
        with:
          github_token: ${{ secrets.CPD_TOKEN }}
          theme: dark
          period: "30"
          output_path: ./code-per-day
          all_themes: "false"
          exclude_repos: "Junction2026_Sargas"

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add code-per-day/
          git diff --cached --quiet || (git commit -m "chore: update code-per-day" && git push)
